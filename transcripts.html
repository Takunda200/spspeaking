<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Transcript Portal | School of Public Speaking</title>
    <style>
        /* --- COLOR THEME --- */
        :root {
            --primary-blue: #003366; /* SPS Blue */
            --primary-red: #800000;  /* SPS Red */
            --bg-light: #eef2f6;
        }

        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: var(--bg-light); 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
            padding: 20px; 
        }

        .portal-box { 
            background: white; 
            padding: 40px; 
            border-radius: 12px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.1); 
            width: 100%; 
            max-width: 400px; 
            text-align: center; 
            border-top: 5px solid var(--primary-blue);
            transition: all 0.3s ease-in-out;
        }
        
        .portal-box.expanded { max-width: 900px; }

        .logo { max-width: 150px; margin-bottom: 20px; }

        h2 { color: var(--primary-blue); margin-top: 0; }
        p { color: #666; }

        input { 
            width: 90%; 
            padding: 12px; 
            margin: 10px 0; 
            border: 2px solid #ddd; 
            border-radius: 6px; 
            font-size: 14px;
            box-sizing: border-box; /* Keeps padding inside width */
        }
        input:focus { border-color: var(--primary-blue); outline: none; }

        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: background-color 0.2s;
            margin-top: 10px;
        }

        .btn-blue { background-color: var(--primary-blue); color: white; }
        .btn-blue:hover { background-color: #002244; }
        
        .btn-red { background-color: var(--primary-red); color: white; }
        .btn-red:hover { background-color: #600000; }

        .error { color: var(--primary-red); font-size: 14px; margin-top: 15px; display: none; font-weight: bold;}

        /* --- DOWNLOAD AREA STYLES --- */
        #download-area { display: none; margin-top: 30px; text-align: left;}
        
        .top-actions {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            justify-content: space-between;
            align-items: center;
        }
        
        a.download-button-link {
            display: inline-block;
            text-decoration: none;
            background-color: var(--primary-blue);
            color: white;
            padding: 12px 24px;
            border-radius: 6px;
            font-weight: bold;
            flex-grow: 1;
            text-align: center;
        }
        a.download-button-link:hover { background-color: #002244; }

        .logout-btn-small { width: auto; padding: 12px 20px; margin-top: 0; }

        #pdf-frame {
            width: 100%;
            height: 600px;
            border: 2px solid #ddd;
            border-radius: 6px;
        }
        
        .back-link {
            display: block;
            margin-top: 20px;
            color: #888;
            text-decoration: none;
            font-size: 0.9rem;
        }
        .back-link:hover { color: var(--primary-blue); text-decoration: underline; }
    </style>
</head>
<body>

    <div class="portal-box" id="main-box">
        <img src="static/images/logos/logo.png" alt="School Logo" class="logo" onerror="this.src='logo.png'">

        <div id="login-section">
            <h2>Transcript Portal</h2>
            <p>Please enter your student details to log in.</p>
            
            <input type="text" id="fname" placeholder="Forename (e.g. Takunda)">
            <input type="text" id="sname" placeholder="Surname (e.g. Matogo)">
            <input type="text" id="sid" placeholder="Student ID (e.g. CPS26113)">
            
            <button class="btn btn-blue" onclick="checkLogin()">LOG IN</button>
            
            <p id="error-msg" class="error">Details not found. Please check spelling and ID.</p>
            
            <a href="index.html" class="back-link">&larr; Back to Main Website</a>
        </div>

        <div id="download-area">
            <div class="top-actions">
                <a id="final-download-btn" class="download-button-link" href="#" download>DOWNLOAD PDF NOW</a>
                <button class="btn btn-red logout-btn-small" onclick="location.reload()">Log Out</button>
            </div>

            <iframe id="pdf-frame" src="">
                <p>Your browser does not support embedded PDFs. Please use the download button above.</p>
            </iframe>
        </div>
    </div>

        function checkLogin() {
            var userFname = document.getElementById("fname").value.trim().toLowerCase();
            var userSname = document.getElementById("sname").value.trim().toLowerCase();
            var userId = document.getElementById("sid").value.trim(); // ID is case-sensitive (CPS...)

            var studentId = "";

            for (var i = 0; i < students.length; i++) {

                    studentId = s.id;
                    break;
                }
            }

            if (found) {

                var finalLink = "transcripts/" + studentId + ".pdf";

                document.getElementById("login-section").style.display = "none";
